name: Analyze & Test

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  analyze_test:
    name: Analyze baseline & flutter test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # lib/config/config.dart 为 git-crypt 加密文件，analyze/test 均需可读
      - name: Unlock secrets (Linux)
        uses: sliteteam/github-action-git-crypt-unlock@1.3.0
        env:
          GIT_CRYPT_KEY: ${{ secrets.ENCODED_GIT_CRYPT }}

      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      # 基线比对：只允许减少不允许新增告警（scripts/check_analyze.sh）
      - name: Analyze baseline check
        run: scripts/check_analyze.sh

      - name: Flutter test
        run: flutter test
