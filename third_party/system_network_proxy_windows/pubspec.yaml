name: system_network_proxy_windows
description: It's a simple utility of system network proxy which can get and set status of proxy, details of proxy.
version: 1.0.2
homepage: https://github.com/liudonghua123/system_network_proxy

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter
  system_network_proxy_platform_interface: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  pedantic: ^1.8.0

flutter:
  plugin:
    implements: system_network_proxy
    platforms:
      windows:
        dartPluginClass: SystemNetworkProxyWindows
